<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GigFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>GigFlow</h1>
      <p>Booking tracker for artists and managers</p>
    </div>
  </header>

  <main class="container">
    <section class="stats" aria-label="Dashboard">
      <div class="stat"><span class="stat-label">Total Booking Requests</span><span class="stat-value" id="stat-total">0</span></div>
      <div class="stat"><span class="stat-label">Confirmed Bookings</span><span class="stat-value" id="stat-confirmed">0</span></div>
      <div class="stat"><span class="stat-label">Expected Earnings (Confirmed)</span><span class="stat-value" id="stat-expected">0,00 €</span></div>
      <div class="stat"><span class="stat-label">Potential Earnings (Inquiries &amp; Offers)</span><span class="stat-value" id="stat-potential">0,00 €</span></div>
    </section>

    <section class="card" aria-labelledby="upcoming-title">
      <h2 id="upcoming-title">Upcoming Performances</h2>
      <ul id="upcoming-list" class="upcoming-list"></ul>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Add Booking</h2>
      <form id="booking-form" novalidate>
        <input type="hidden" id="booking-id">
        <div class="form-grid">
          <label>Client Name
            <input type="text" id="client" required>
          </label>
          <label>Event Date
            <input type="date" id="date" required>
          </label>
          <label>Event Location
            <input type="text" id="location" required>
          </label>
          <label>Event Type
            <select id="type">
              <option>Wedding</option>
              <option>Birthday</option>
              <option>Corporate Event</option>
              <option>Other</option>
            </select>
          </label>
          <label>Offered Price (€)
            <input type="number" id="price" min="0" step="0.01" required>
          </label>
          <label>Status
            <select id="status">
              <option>Inquiry</option>
              <option>Offer Sent</option>
              <option>Confirmed</option>
              <option>Cancelled</option>
            </select>
          </label>
          <label class="full">Song Selection (optional)
            <textarea id="songs" rows="3" placeholder="One song per line"></textarea>
          </label>
          <label class="full">Notes (optional)
            <textarea id="notes" rows="3"></textarea>
          </label>
        </div>
        <p id="form-error" class="error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn primary">Add Booking</button>
          <button type="button" id="cancel-edit-btn" class="btn" hidden>Cancel Editing</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">All Bookings</h2>
        <div class="controls">
          <label>Filter by Status
            <select id="filter">
              <option value="all">All</option>
              <option>Inquiry</option>
              <option>Offer Sent</option>
              <option>Confirmed</option>
              <option>Cancelled</option>
            </select>
          </label>
          <label>Sort by Event Date
            <select id="sort">
              <option value="asc">Earliest first</option>
              <option value="desc">Latest first</option>
            </select>
          </label>
        </div>
      </div>
      <div id="booking-list" class="booking-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
